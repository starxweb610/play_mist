<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="2048 - The addictive sliding tile puzzle game. Combine tiles to reach 2048!" />
  <title>2048 – Slide & Merge</title>

  <!-- Google Font: modern, clean -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&display=swap"
    rel="stylesheet"
  />

  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d1a;           /* fallback colour while Phaser loads */
      font-family: 'Outfit', sans-serif;
    }

    /* ── Phaser canvas wrapper ────────────────────────────── */
    #game-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* Phaser injects a <canvas> here.  We let it fill the viewport. */
    #game-container canvas {
      display: block;
      /* Phaser handles actual pixel size; this keeps it centred */
      max-width: 100%;
      max-height: 100%;
    }

    /* ── Loading overlay (shown before Phaser is ready) ──── */
    #boot-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      z-index: 9999;
      transition: opacity 0.6s ease;
    }
    #boot-overlay.hidden { opacity: 0; pointer-events: none; }

    .boot-spinner {
      width: 56px;
      height: 56px;
      border: 4px solid rgba(139, 92, 246, 0.25);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .boot-label {
      margin-top: 18px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Loading overlay – hidden once Phaser signals "ready" -->
  <div id="boot-overlay">
    <div class="boot-spinner"></div>
    <p class="boot-label">Loading…</p>
  </div>

  <!-- Phaser canvas target -->
  <div id="game-container"></div>

  <!-- ── Phaser 3 (CDN) ─────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

  <!-- ── Game scenes (order matters – dependencies first) ── -->
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/HomeScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/PauseScene.js"></script>

  <!-- ── Main game config & launch ─────────────────────── -->
  <script src="js/game.js"></script>

</body>
</html>
